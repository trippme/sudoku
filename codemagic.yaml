# Codemagic CI/CD — iOS build + TestFlight for the Sudoku app.
#
# The Flutter project lives in the app/ subfolder, so every script cd's into it.
#
# ── One-time setup in the Codemagic UI (Team settings / app settings) ──────────
#  1. Integrations → Developer Portal (App Store Connect API key): add your key
#     and note its NAME. Put that name below at  app_store_connect: <name>.
#  2. Environment variables → group "sudoku" (mark Secure):
#       BACKEND_API_KEY         = contents of server/data/api-key.txt (so the
#                                 released app authenticates against the backend)
#       CERTIFICATE_PRIVATE_KEY = an RSA-2048 private key so `fetch-signing-files
#                                 --create` can create/reuse the distribution
#                                 certificate. Generate once with:
#                                   ssh-keygen -t rsa -b 2048 -m PEM \
#                                     -f codemagic_private_key -q -N ""
#                                 then paste the contents of the `codemagic_private_key`
#                                 file (the PRIVATE one, no .pub) as the value.
#  3. The bundle id  net.whimsicle.sudokuApp  must be registered as an App ID in
#     your Apple Developer account. The signing step below then creates the
#     distribution certificate + provisioning profile for it automatically.
#
# Build numbers come from Codemagic's monotonic $BUILD_NUMBER so every TestFlight
# upload is unique; the marketing version comes from app/pubspec.yaml (1.0.0).

workflows:
  ios-testflight:
    name: iOS — TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: Sudoku   # ← Codemagic integration NAME (not Apple's key id)
    environment:
      groups:
        - sudoku                               # BACKEND_API_KEY + CERTIFICATE_PRIVATE_KEY (secure)
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Flutter pub get
        script: |
          cd app
          flutter pub get
      - name: Set up code signing (fetch + create cert & profile)
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "net.whimsicle.sudokuApp" \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
          cd app/ios
          xcode-project use-profiles
      - name: CocoaPods install
        script: |
          cd app/ios
          pod install
      - name: Build signed IPA
        script: |
          cd app
          flutter build ipa --release \
            --build-number=$BUILD_NUMBER \
            --dart-define=BACKEND_API_KEY="$BACKEND_API_KEY" \
            --dart-define=GIT_SHA="$(git rev-parse --short HEAD)" \
            --dart-define=BUILD_TIME="codemagic-$BUILD_NUMBER" \
            --export-options-plist=$HOME/export_options.plist
    artifacts:
      - app/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - app/flutter_drive.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # Beta testers get it automatically; flip to App Store review when ready:
        # submit_to_app_store: false

  # ── Ad Hoc: install directly on your own iPhone, no TestFlight ──────────────
  # iOS won't let you install an App Store (release) build directly; an "Ad Hoc"
  # build is the equivalent for named devices. It uses the PRODUCTION APNs
  # environment (same as TestFlight), so push keeps working with the existing
  # .p8 — no other changes needed.
  #
  # ONE-TIME prerequisite: your iPhone must be registered in the Apple Developer
  # account, or the Ad Hoc profile won't include it and the .ipa won't install.
  #   1. Get the device UDID (on Windows: connect the iPhone, open the Apple
  #      Devices app or iTunes → click the device → click the Serial Number field
  #      until it shows "UDID" → copy; or read it in Sideloadly / 3uTools).
  #   2. developer.apple.com → Certificates, Identifiers & Profiles → Devices →
  #      + → paste the UDID, name it, Continue/Register.
  # (Adding a new device later requires re-running this build so the profile is
  # regenerated to include it — fetch-signing-files --create handles that.)
  #
  # AFTER the build: download the .ipa from the build's Artifacts, then install
  # on the iPhone from Windows with Sideloadly (https://sideloadly.io): plug in
  # the phone, drag the .ipa in, sign in with your Apple ID, Start.
  ios-adhoc:
    name: iOS — Ad Hoc (direct install)
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: Sudoku   # ← Codemagic integration NAME (not Apple's key id)
    environment:
      groups:
        - sudoku                               # BACKEND_API_KEY + CERTIFICATE_PRIVATE_KEY (secure)
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Flutter pub get
        script: |
          cd app
          flutter pub get
      - name: Set up code signing (Ad Hoc profile — includes registered devices)
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "net.whimsicle.sudokuApp" \
            --type IOS_APP_ADHOC \
            --create
          keychain add-certificates
          cd app/ios
          xcode-project use-profiles
      - name: CocoaPods install
        script: |
          cd app/ios
          pod install
      - name: Build Ad Hoc IPA
        script: |
          cd app
          flutter build ipa --release \
            --build-number=$BUILD_NUMBER \
            --dart-define=BACKEND_API_KEY="$BACKEND_API_KEY" \
            --dart-define=GIT_SHA="$(git rev-parse --short HEAD)" \
            --dart-define=BUILD_TIME="codemagic-adhoc-$BUILD_NUMBER" \
            --export-options-plist=$HOME/export_options.plist
    # No publishing block: the .ipa is downloaded from Artifacts and sideloaded,
    # not sent to TestFlight.
    artifacts:
      - app/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
